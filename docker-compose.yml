services:
  nginx:
    build:
      context: .
      dockerfile: ./docker/nginx/Dockerfile
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      - php
    networks:
      - internal

  php:
    build:
      context: .
      dockerfile: ./docker/php/Dockerfile
    # image: php:fpm-alpine
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www/html
    expose:
      - "9000"
    networks:
      - internal

networks:
  internal:
    driver: bridge
